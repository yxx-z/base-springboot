server:
  port: 6059

spring:
  application:
    name: business
  profiles:
    # 默认使用开发环境；生产部署必须通过 SPRING_PROFILES_ACTIVE 显式覆盖。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration/shared
    table: flyway_schema_history
    validate-on-migrate: true

app:
  name: user

features:
  mail:
    # 关闭后应用仍可启动，但验证码和密码重置邮件接口会返回“功能未启用”。
    enabled: ${FEATURE_MAIL_ENABLED:true}
  alipay-login:
    # 不需要支付宝登录的项目可关闭；关闭后不会创建支付宝客户端、策略和接口。
    enabled: ${FEATURE_ALIPAY_LOGIN_ENABLED:false}

# 密码策略可由具体部署覆盖；默认规则适用于基础框架，不把策略写死在 DTO 中。
security:
  session:
    sliding-expiration:
      enabled: ${SECURITY_SESSION_SLIDING_ENABLED:true}
      timeout: ${SECURITY_SESSION_SLIDING_TIMEOUT:7d}
    # 数据库提交后立即注销会话；Redis 瞬时故障时按配置执行有限内存重试。
    invalidation:
      retry-enabled: ${SECURITY_SESSION_INVALIDATION_RETRY_ENABLED:true}
      retry-delays: ${SECURITY_SESSION_INVALIDATION_RETRY_DELAYS:1s,5s,30s}
  password-policy:
    min-length: ${SECURITY_PASSWORD_MIN_LENGTH:12}
    max-bytes: ${SECURITY_PASSWORD_MAX_BYTES:72}
    require-uppercase: ${SECURITY_PASSWORD_REQUIRE_UPPERCASE:true}
    require-lowercase: ${SECURITY_PASSWORD_REQUIRE_LOWERCASE:true}
    require-digit: ${SECURITY_PASSWORD_REQUIRE_DIGIT:true}
    require-special-character: ${SECURITY_PASSWORD_REQUIRE_SPECIAL:false}
    allow-whitespace: ${SECURITY_PASSWORD_ALLOW_WHITESPACE:false}

# Controller 参数访问日志默认关闭；需要时显式开启，业务审计仍由 @AuditLog 独立控制。
web:
  access-log:
    enabled: ${WEB_ACCESS_LOG_ENABLED:false}

logging:
  file:
    # 生产环境应通过 LOG_PATH 配置独立于程序目录的绝对路径。
    path: ${LOG_PATH:./logs}
  level:
    # 默认不记录 SQL 参数；开发环境可在 application-dev.yml 中临时开启 DEBUG。
    com.yxx.business.mapper: info
