server:
  port: 6059

spring:
  profiles:
    # 默认使用开发环境；生产部署必须通过 SPRING_PROFILES_ACTIVE 显式覆盖。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration/business
    table: flyway_schema_history_business
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  name: user

logging:
  file:
    path: ./logs
    name: business
  level:
    # 默认不记录 SQL 参数；开发环境可在 application-dev.yml 中临时开启 DEBUG。
    com.yxx.business.mapper: info
