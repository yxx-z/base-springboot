server:
  port: 6059

spring:
  profiles:
    # 默认使用开发环境；生产部署必须通过 SPRING_PROFILES_ACTIVE 显式覆盖。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration/shared
    table: flyway_schema_history
    validate-on-migrate: true

app:
  name: user

# 密码策略可由具体部署覆盖；默认规则适用于基础框架，不把策略写死在 DTO 中。
security:
  password-policy:
    min-length: ${SECURITY_PASSWORD_MIN_LENGTH:12}
    max-bytes: ${SECURITY_PASSWORD_MAX_BYTES:72}
    require-uppercase: ${SECURITY_PASSWORD_REQUIRE_UPPERCASE:true}
    require-lowercase: ${SECURITY_PASSWORD_REQUIRE_LOWERCASE:true}
    require-digit: ${SECURITY_PASSWORD_REQUIRE_DIGIT:true}
    require-special-character: ${SECURITY_PASSWORD_REQUIRE_SPECIAL:false}
    allow-whitespace: ${SECURITY_PASSWORD_ALLOW_WHITESPACE:false}

# Controller 参数访问日志默认关闭；需要时显式开启，业务审计仍由 @AuditLog 独立控制。
web:
  access-log:
    enabled: ${WEB_ACCESS_LOG_ENABLED:false}

logging:
  file:
    path: ./logs
    name: business
  level:
    # 默认不记录 SQL 参数；开发环境可在 application-dev.yml 中临时开启 DEBUG。
    com.yxx.business.mapper: info
